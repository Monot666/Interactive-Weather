<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantau Cuaca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Masukkan nama kota..." spellcheck="false" id="city-input">
            <button id="search-btn"><i class="fas fa-search"></i></button> </div>

        <div class="weather">
            <div class="weather-icon-container">
                <i class="fas fa-cloud-sun" id="main-icon"></i> </div>
            
            <h1 id="temp">--°C</h1>
            <h2 id="city">Nama Kota</h2>
            <p id="description">Kondisi Cuaca</p>

            <div class="details">
                <div class="col">
                    <i class="fas fa-droplet"></i>
                    <div>
                        <p id="humidity">--%</p>
                        <p>Kelembapan</p>
                    </div>
                </div>
                <div class="col">
                    <i class="fas fa-wind"></i>
                    <div>
                        <p id="wind">-- km/h</p>
                        <p>Angin</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
